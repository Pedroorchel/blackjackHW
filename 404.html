<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack Multiplayer</title>
    <script>
      // Safe redirect without infinite loops
      try {
        var now = Date.now();
        var lastRedir = parseInt(sessionStorage.getItem('last_404_time') || '0', 10);
        var count = parseInt(sessionStorage.getItem('redir_count') || '0', 10);
        
        // Reset counter after 10 seconds
        if (now - lastRedir > 10000) {
          count = 0;
        }

        // Limit redirects to max 2 within short timeframe to completely eliminate loop
        if (count < 2) {
          sessionStorage.setItem('last_404_time', now.toString());
          sessionStorage.setItem('redir_count', (count + 1).toString());
          
          var path = window.location.pathname;
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          
          // Determine repo base
          var segments = path.split('/').filter(Boolean);
          var repo = segments.length > 0 ? '/' + segments[0] + '/' : '/';
          
          if (path !== repo) {
            window.location.replace(repo + search + hash);
          }
        }
      } catch (e) {
        console.error(e);
      }
    </script>
  </head>
  <body style="background-color: #0c0a09; color: #f5f5f4; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px;">
    <div style="font-size: 3rem; margin-bottom: 12px;">♠♥♦♣</div>
    <h1 style="color: #fbbf24; font-size: 1.5rem; margin-bottom: 8px;">Blackjack Multiplayer</h1>
    <p style="color: #a8a29e; font-size: 0.95rem; margin-bottom: 24px; max-width: 400px;">Clique abaixo para retornar à mesa de jogo.</p>
    <a href="./" style="display: inline-block; background-color: #f59e0b; color: #0c0a09; font-weight: bold; text-decoration: none; padding: 12px 28px; border-radius: 12px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">Entrar no Jogo</a>
  </body>
</html>
