<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack Multiplayer</title>
    <script>
      // Single Page App redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var pathSegments = location.pathname.split('/');
      // If deployed on github.io/repo-name/, keep repo-name
      var repo = pathSegments[1] ? '/' + pathSegments[1] + '/' : '/';
      location.replace(repo);
    </script>
    <meta http-equiv="refresh" content="0;URL='./'">
  </head>
  <body style="background-color: #0c0a09; color: #f5f5f4; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <p>Redirecionando para o Blackjack...</p>
  </body>
</html>
